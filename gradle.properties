mod_description=You fell through the floor of the world and landed in an office that goes on forever. Office Rooms adds a liminal office dimension with more than ninety floors, seven megastructures (Poolrooms, Hotel, Maze, Cinema, Industrial Complex, Level Fun, Neighbourhood), creatures that hunt in the halls, research, power cuts and hazard zones, research outposts with gateways, Level 0 above the top floor and the Underside beneath the bedrock. Optional: OfficeCraft and Refurbished Furniture (furniture), FTB Quests (quest book with 120 quests).
