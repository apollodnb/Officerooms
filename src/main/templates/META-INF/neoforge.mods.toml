modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="office_rooms_logo.png"
logoBlur=false
credits="Concept, design, music and sounds: Apollo - Developed with Claude (Anthropic) - Optional furniture: MrCrayfish's Refurbished Furniture (not included) - Creature models made with GeckoLib"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.5,)"
    ordering="AFTER"
    side="BOTH"

# Optional: with MrCrayfish's Refurbished Furniture installed, rooms use its chairs, tables, sofas, kitchens and drawers.
[[dependencies.${mod_id}]]
    modId="refurbished_furniture"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
