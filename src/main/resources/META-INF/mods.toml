modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="office_rooms_logo.png"
logoBlur=false
credits="Concept, design, music and sounds: Apollo - Developed with Claude (Anthropic) - Optional furniture: MrCrayfish's Refurbished Furniture (not included) - Creature models made with GeckoLib"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optionale Moebel-Mods (separat installieren). Ohne sie nutzt Office Rooms Vanilla-Ersatz.
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refurbished_furniture"
    mandatory=false
    versionRange="[1.0.20,)"
    ordering="NONE"
    side="BOTH"

# 0.21.2: optional. If MrCrayfish's Refurbished Furniture is installed, Level 0 uses its chairs, tables, sofas and drawers.
[[dependencies.${mod_id}]]
modId="refurbished_furniture"
mandatory=false
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"
